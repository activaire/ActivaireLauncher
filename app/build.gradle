plugins {
    id("com.android.application")
    id("com.google.devtools.ksp")
    id("com.google.firebase.crashlytics") // Crashlytics Gradle plugin
    id("com.google.gms.google-services") // Google Services Gradle plugin
    id("org.jetbrains.kotlin.android")
}

android {
    compileSdk 34
    buildToolsVersion '34.0.0'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    signingConfigs {
        debugConfig {
            keyAlias 'Activaire'
            keyPassword 'activ8190'
            storeFile file('../../Android-Keys/Activaire App Key/activaire.jks')
            storePassword 'activ8190'
        }
        releaseConfig {
            keyAlias 'Activaire'
            keyPassword 'activ8190'
            storeFile file('../../Android-Keys/Activaire App Key/activaire.jks')
            storePassword 'activ8190'
        }
    }
    defaultConfig {
        applicationId "com.activaire.launcher"
        minSdkVersion 22
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdkVersion 29
        versionCode 61
        versionName "1.61"
        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ['en', 'ru', 'uk', 'it', 'fr', 'es', 'de', 'pl', 'zh-rCN']
        setProperty("archivesBaseName", "ActivaireLauncher-" + versionName)
    }
    packagingOptions {
        resources.excludes += "DebugProbesKt.bin"
    }
    buildTypes {
        release {
            lintOptions {
                disable 'MissingTranslation'
                disable 'ResourceType'
            }
            minifyEnabled false
            signingConfig signingConfigs.releaseConfig
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debugConfig
        }
    }
    lint {
        abortOnError false
    }
    namespace 'com.amazon.tv.leanbacklauncher'
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    def leanback_version = "1.2.0-alpha04" // "1.0.0"
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // androidx
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.leanback:leanback:$leanback_version"
    implementation "androidx.leanback:leanback-preference:$leanback_version"
    implementation 'androidx.lifecycle:lifecycle-process:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    // glide
    def glideVersion = '4.16.0'
    implementation "com.github.bumptech.glide:glide:${glideVersion}"
    ksp "com.github.bumptech.glide:ksp:${glideVersion}"
    implementation 'com.google.guava:guava:32.0.1-jre'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    // Add the dependency for the Firebase SDK for Google Analytics
    // When using the BoM, don't specify versions in Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    // LocalWeather
    implementation 'com.github.interaapps:LocalWeather-Android:2.0'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

